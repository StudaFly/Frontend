name: "Technical Task & Maintenance"
description: "UI refactoring, Zustand state optimization, Tailwind styling, or accessibility"
title: "[TASK]: "
labels: ["technical", "frontend"]
body:
  - type: dropdown
    id: task_category
    attributes:
      label: "Task Category"
      options:
        - "Component Refactoring (shadcn / React)"
        - "State Management (Zustand / API integration)"
        - "Accessibility (a11y) & Responsiveness"
        - "Build / Vite / Tailwind Configuration"
        - "Testing (Jest / React Testing Library / Playwright)"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "Task Description"
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: "Acceptance Criteria"
      placeholder: |
        - [ ] Component is fully responsive (Mobile/Tablet/Desktop)
        - [ ] Keyboard accessible
        - [ ] Tests pass
    validations:
      required: true